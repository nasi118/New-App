[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tax"
version = "0.1.0"
description = "Tax planning application: deterministic tax engine, scenario planning, audit packages, and a constrained Tax Planning Analyst Agent"
license = {text = "Proprietary - see NOTICE.md"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "openpyxl>=3.1",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
agent = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["ai_tax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
